<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <!-- import jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="index.js"></script>
</head>

<body>
  <!-- Function bar -->
  <div id="header">

    <!-- Status -->
    <div id="status">
      <span>Clicks: <strong id="stat-clicks">0</strong></span>
      <span>Time: <strong id="stat-timer">--:--</strong></span>
      <span>Matched: <strong id="stat-matched">0</strong></span>
      <span>Pairs Left: <strong id="stat-left">0</strong></span>
      <span>Total Pairs: <strong id="stat-total">0</strong></span>
    </div>

    <!-- controls -->
    <div id="controls">
      <span>Difficulty:</span>
      <button class="btn diff-btn active" id="diff-easy">Easy</button>
      <button class="btn diff-btn" id="diff-medium">Medium</button>
      <button class="btn diff-btn" id="diff-hard">Hard</button>

      <span style="margin-left:12px;">Theme:</span>
      <button class="btn theme-btn active" id="theme-light">Light</button>
      <button class="btn theme-btn" id="theme-dark">Dark</button>
 
      <button class="btn action-btn" id="btn-start">Start</button>
      <button class="btn action-btn" id="btn-reset">Reset</button>
      <button class="btn peek-btn" id="btn-powerup" disabled>Peek</button>
    </div>
  </div>

  <!--Ending message-->
  <div id="message" class="hidden"></div>

  <!--Game containter-->
  <div id="pokemon_grid"></div>

</body>

</html>
